name: database

on:
  pull_request:
  push:
    branches: [master]

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations and pgTAP tests
        run: bash scripts/db/test.sh
      - name: Security audit
        run: pnpm db:audit:test
